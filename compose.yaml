services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Defineix POSTGRES_USER a .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defineix POSTGRES_PASSWORD a .env}
      POSTGRES_DB: ${POSTGRES_DB:?Defineix POSTGRES_DB a .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init/01-create-test-db.sql:/docker-entrypoint-initdb.d/01-create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
    name: postgres_data
